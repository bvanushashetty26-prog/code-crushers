<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard – CivicReport</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <!-- Leaflet -->
  <link  rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
</head>
<body>

<!-- ─── Header ─────────────────────────────────────────────────── -->
<header class="site-header">
  <div class="header-inner">
    <a href="/" class="brand">
      <span class="brand-icon">🏛</span>
      <span class="brand-name">CivicReport</span>
    </a>
    <nav class="header-nav">
      <a href="/">Home</a>
      <a href="/report">Report</a>
      <a href="/track">Track</a>
    </nav>
  </div>
</header>

<!-- ─── Main ────────────────────────────────────────────────────── -->
<main class="admin-layout">

  <!-- ── Stat cards row ── -->
  <section class="admin-section" id="statsSection">
    <h2 class="admin-section-title">Overview</h2>
    <div class="stat-cards" id="statCards">
      <!-- injected by JS -->
    </div>
  </section>

  <!-- ── Map + Chart row ── -->
  <div class="admin-two-col">

    <!-- Map -->
    <section class="admin-section map-section">
      <h2 class="admin-section-title">
        Priority Map
        <span class="legend-row" id="mapLegend"></span>
      </h2>
      <div id="adminMap" class="admin-map"></div>
    </section>

    <!-- Chart + Brief -->
    <div class="admin-side-col">

      <!-- Category bar chart -->
      <section class="admin-section chart-section">
        <h2 class="admin-section-title">Reports by Category</h2>
        <div class="chart-wrap">
          <canvas id="catChart" aria-label="Category bar chart"></canvas>
        </div>
      </section>

      <!-- Action brief -->
      <section class="admin-section brief-section" id="briefSection">
        <h2 class="admin-section-title">
          Action Brief
          <span class="rule-label">Rule-based summary</span>
        </h2>
        <div id="briefContent" class="brief-content">
          <p class="brief-loading">Loading…</p>
        </div>
      </section>

    </div><!-- /admin-side-col -->

  </div><!-- /admin-two-col -->

  <!-- ── Reports table section ── -->
  <section class="admin-section table-section">

    <!-- Filters toolbar -->
    <div class="table-toolbar">
      <h2 class="admin-section-title">All Reports</h2>
      <div class="filter-row">
        <select id="filterStatus"   class="field-input filter-select"><option value="">All statuses</option></select>
        <select id="filterCategory" class="field-input filter-select"><option value="">All categories</option></select>
        <select id="filterPriority" class="field-input filter-select"><option value="">All priorities</option></select>
        <button id="clearFilters" class="btn btn-outline btn-sm">✕ Clear</button>
      </div>
    </div>

    <div class="table-wrap">
      <table class="admin-table" id="reportsTable">
        <thead>
          <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Category</th>
            <th>Priority</th>
            <th>Status</th>
            <th>Assigned</th>
            <th>Date</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="8" class="tbl-loading">Loading reports…</td></tr>
        </tbody>
      </table>
    </div>

  </section>

  <!-- ── Action panel ── -->
  <section class="admin-section action-section" id="actionPanel" hidden>
    <h2 class="admin-section-title">
      Update Report
      <button id="closeAction" class="link-btn action-close">✕ Close</button>
    </h2>

    <div class="action-grid">
      <div class="action-info">
        <p class="action-tracking-id" id="actionTrackingId"></p>
        <p class="action-title-text"  id="actionTitle"></p>
      </div>

      <div class="field">
        <label class="field-label" for="actionStatus">New Status</label>
        <div class="select-wrap">
          <select id="actionStatus" class="field-input">
            <option value="Submitted">Submitted</option>
            <option value="Under Review">Under Review</option>
            <option value="Assigned">Assigned</option>
            <option value="In Progress">In Progress</option>
            <option value="Resolved">Resolved</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label class="field-label" for="actionAssigned">Assign To</label>
        <input type="text" id="actionAssigned" class="field-input"
               placeholder="Officer name (optional)">
      </div>

      <div class="field action-note-field">
        <label class="field-label" for="actionNote">Note</label>
        <textarea id="actionNote" class="field-input" rows="2"
                  placeholder="Optional note for the status history"></textarea>
      </div>
    </div>

    <div class="action-footer">
      <button id="submitAction" class="btn btn-primary btn-sm">💾 Save Changes</button>
      <span id="actionMsg" class="action-msg" hidden></span>
    </div>
  </section>

</main><!-- /admin-layout -->

<!-- Leaflet JS (loaded after DOM) -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
